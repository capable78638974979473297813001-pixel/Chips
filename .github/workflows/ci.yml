name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make build
      - run: make cross
  agent:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S agent -B agent/build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - run: cmake --build agent/build -j --config Debug
      - run: ctest --test-dir agent/build -C Debug --output-on-failure
      - if: runner.os != 'Windows'
        run: agent/build/chipagent --once
      - if: runner.os == 'Windows'
        run: agent/build/Debug/chipagent.exe --once
  agent-multiarch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user g++-aarch64-linux-gnu g++-arm-linux-gnueabihf \
            g++-i686-linux-gnu g++-powerpc64le-linux-gnu g++-s390x-linux-gnu \
            g++-riscv64-linux-gnu g++-mips-linux-gnu
      - run: scripts/agent-cross-test.sh
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: router image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
      - name: chipagent image
        uses: docker/build-push-action@v6
        with:
          context: agent
          push: false
      - uses: azure/setup-helm@v4
      - name: helm chart
        run: |
          helm lint deploy/helm/siliconrouter --set existingSecret=s
          helm template sr deploy/helm/siliconrouter --set existingSecret=s,agent.enabled=true,tls.secretName=t,persistence.enabled=true > /dev/null
          helm template sr deploy/helm/siliconrouter --set replicaCount=1 > /dev/null
          helm template sr deploy/helm/siliconrouter --set existingSecret=s,gateway.enabled=true,gateway.inferencePool.create=true,gateway.inferencePool.selector.app=vllm > /dev/null
      - name: systemd units
        run: |
          sudo touch /usr/local/bin/siliconrouter /usr/local/bin/chipagent
          sudo chmod +x /usr/local/bin/siliconrouter /usr/local/bin/chipagent
          systemd-analyze verify deploy/systemd/*.service
