# SiliconRouter configuration reference.
# Every setting except `backends` (or `discovery`) is optional; the values shown are the defaults.

listen: ":8080"
max_body_bytes: 16777216          # reject request bodies larger than this (16 MiB)

# Serve HTTPS. Certificate files are re-read when they change (no restart).
# tls:
#   cert_file: /etc/siliconrouter/tls.crt
#   key_file: /etc/siliconrouter/tls.key
#   client_ca_file: ""              # require client certificates signed by this CA (mTLS)
#   min_version: "1.2"              # or "1.3"

# Protect the router with keys (Authorization: Bearer, x-api-key or api-key).
# Leave everything empty for an open router. See docs/OPERATIONS.md.
auth:
  api_keys: []
  api_keys_env: SILICONROUTER_API_KEYS   # comma-separated keys from the environment
  # Only these may use /admin/* (backends, usage, reload). Without any, every client key can.
  admin_keys: []
  admin_keys_env: SILICONROUTER_ADMIN_KEYS
  # Named keys with a queue priority and optional limits. Usage is reported per name.
  # keys:
  #   - {name: chat-app, key_env: CHAT_APP_KEY, priority: high}
  #   - name: nightly-batch
  #     key_env: BATCH_KEY
  #     priority: low                # high jumps ahead of normal, normal ahead of low
  #     max_concurrent: 8            # requests in flight or queued at once
  #     requests_per_minute: 120     # sustained rate; bursts up to a minute's worth
  #     tokens_per_day: 2000000      # prompt + completion tokens per UTC day
  #   - name: interns
  #     key_env: INTERN_KEY
  #     models: ["llama-3.1-8b", "qwen2.5-*"]  # only these models (exact, or prefix*)
  #     max_tokens: 1024             # completion budget cap per request

# Your inference servers. Any HTTP inference API works: OpenAI-style (vLLM, SGLang,
# llama.cpp, Ollama, LM Studio), Ollama/TGI native, Triton/KServe, and custom services.
# See docs/COMPATIBILITY.md.
backends:
  - name: h100-node-1
    url: http://10.0.0.11:8000      # vLLM
    tier: heavy                     # heavy | standard | light | reserve
    max_concurrency: 64             # requests this server handles at once; the rest queue in the router
    max_context_tokens: 131072      # skip this node for prompts that would not fit (0 = no limit)
    models: [llama-3.1-70b]         # omit to auto-discover from GET /v1/models
    api_key_env: H100_API_KEY       # optional bearer token sent to this backend
    agent_url: http://10.0.0.11:9400  # optional chipagent on this machine (see docs/HARDWARE.md)
    metrics_path: /metrics          # optional: route on the engine's own queue and KV-cache use (docs/TUNING.md)
    # api_key_header: x-api-key     # send the key in this header instead of "Authorization: Bearer"
    # health_path: /health          # per-backend override of health.path (TGI /health, Triton /v2/health/ready)
    # tokenize: vllm                # exact token counts near context limits: vllm, llamacpp or tgi
    # grpc_url: http://10.0.0.11:8001  # gRPC endpoint, if it has one (Triton/KServe)

  - name: mac-studio-2
    url: http://10.0.0.12:11434     # Ollama
    tier: standard
    max_concurrency: 8
    max_context_tokens: 32768

  - name: mi300-reserve-3
    url: http://10.0.0.13:8000      # vLLM on ROCm
    tier: reserve                   # only used when every other node is full or down
    max_concurrency: 32

  - name: gpu-node-4
    url: http://10.0.0.14:8000
    tier: auto                      # chipagent's hardware report picks heavy, standard or light
    agent_url: http://10.0.0.14:9400
    max_concurrency: 32

routing:
  # Send follow-up turns of a conversation to the node that already has the
  # earlier turns in its KV cache, so it skips recomputing them.
  prefix_affinity: true
  block_chars: 256                  # prefix matching granularity
  max_blocks: 256                   # match on at most the first 64 KiB of a prompt
  affinity_ttl: 30m                 # forget prefixes not seen for this long
  affinity_capacity: 200000         # prefixes remembered (LRU)
  # Give up the cache hit if the caching node is this much busier (fraction of
  # its capacity) than the least busy alternative. Lower = more even load,
  # higher = more cache reuse.
  affinity_max_imbalance: 0.5
  large_request_tokens: 2048        # prompts above this prefer heavy nodes; below, light nodes
  chars_per_token: 4                # for size estimates of English and code; no tokenizer needed
  exact_tokens_margin: 0.2          # within 20% of a context limit, count exactly (backends with `tokenize`)

queue:
  max_waiting: 1024                 # beyond this, answer 429 + Retry-After immediately
  max_wait: 30s                     # how long a request may wait for a free slot
  priority_header: false            # let clients send X-SiliconRouter-Priority: high|normal|low (trusted clients only)

retry:
  max_attempts: 3                   # tries across different backends before giving up
  # A streaming response that produces nothing for this long is moved to another
  # backend before the client sees a byte (the last attempt always waits).
  # 60s tolerates very long prompts; 10-20s suits chat.
  first_token_timeout: 60s

# Answer repeated requests from memory. Only answers that cannot change are
# cached: embeddings, and generations with temperature 0 (mode: all caches
# everything). Clients can skip it with "Cache-Control: no-cache".
cache:
  enabled: false
  mode: deterministic
  ttl: 10m
  max_bytes: 268435456              # 256 MiB in total
  max_entry_bytes: 4194304          # responses larger than 4 MiB are not stored
  share_across_keys: false          # true lets different API keys share cached answers

# Names clients use -> the model that serves them. Lets apps written for one
# model keep working when you swap in another.
models:
  aliases: {}
  # aliases:
  #   gpt-4o: llama-3.1-70b
  #   text-embedding-3-small: bge-large-en
  # When a model's backends are down, saturated or too slow to free a slot,
  # try these models instead, in order.
  fallbacks: {}
  # fallbacks:
  #   llama-3.1-70b: [llama-3.1-8b]

# Find backends in DNS instead of (or as well as) listing them above.
# Each A/AAAA record or SRV target becomes a backend named <name>-<host>:<port>.
# discovery:
#   - name: vllm
#     dns: vllm-headless.ai.svc.cluster.local   # or srv: _http._tcp.vllm.service.consul
#     port: 8000                                # dns only; SRV records carry the port
#     scheme: http
#     interval: 15s
#     agent_port: 9400                          # chipagent on each host (optional)
#     grpc_port: 0                              # gRPC endpoint on each host (optional)
#     backend: {tier: auto, max_concurrency: 32}  # any backend setting except name/urls

health:
  disabled: false
  path: /v1/models                  # Ollama's native /api/tags also works
  interval: 5s
  timeout: 2s
  unhealthy_threshold: 3            # consecutive failures before a node is pulled
  healthy_threshold: 2              # consecutive successes before it returns

upstream:
  dial_timeout: 5s
  response_header_timeout: 0s       # 0 = none; non-streaming replies only send headers when generation ends

# Scraping of engines' own load metrics (only for backends with metrics_path).
engine_metrics:
  interval: 2s
  timeout: 1s
  kv_saturated: 0.95                # KV-cache usage at which an engine gets new work only as a last resort

# chipagent telemetry (only used by backends with agent_url).
hardware:
  poll_interval: 10s
  timeout: 2s
  heavy_min_memory_gib: 64          # tier auto: total accelerator memory for heavy...
  standard_min_memory_gib: 20       # ...and for standard; below this a node is light

# Save the response cache and usage counters across restarts.
# state_dir: /var/lib/siliconrouter

# Several routers behind one load balancer (see docs/OPERATIONS.md).
# cluster:
#   peers: ["https://router-0:8443", "https://router-1:8443"]
#   secret_env: SILICONROUTER_CLUSTER_SECRET
#   sync_interval: 1s

# Export traces to an OpenTelemetry collector (traceparent is always passed on).
# tracing:
#   otlp_endpoint: http://otel-collector:4318
#   sample_rate: 1.0

# logging:
#   request_sample_rate: 1.0        # share of successful requests logged; errors always are
#   slow_request: 0s                # always log requests slower than this
