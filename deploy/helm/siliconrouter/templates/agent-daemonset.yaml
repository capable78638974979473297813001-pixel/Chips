{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "siliconrouter.fullname" . }}-agent
  labels: {{- include "siliconrouter.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: agent
    spec:
      {{- with .Values.agent.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      # Host networking so routers reach each node's agent at <node>:port,
      # matching the agent_url values in the router config.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: chipagent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          args: ["--listen", ":{{ .Values.agent.port }}"]
          ports:
            - {name: telemetry, containerPort: {{ .Values.agent.port }}}
          readinessProbe:
            httpGet: {path: /healthz, port: telemetry}
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
