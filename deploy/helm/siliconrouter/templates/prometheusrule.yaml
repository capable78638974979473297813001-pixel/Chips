{{- if .Values.prometheusRule.enabled }}
# Alert rules (a copy of deploy/prometheus/alerts.yaml) for the Prometheus Operator.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "siliconrouter.fullname" . }}
  labels:
    {{- include "siliconrouter.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "files/alerts.yaml" | nindent 2 }}
{{- end }}
